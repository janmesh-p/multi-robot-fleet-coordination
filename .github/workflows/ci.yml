name: ci

on:
  push:
  pull_request:

jobs:
  core:
    name: fleet_core (${{ matrix.name }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            build_type: Release
            sanitize: "OFF"
            fuzz_cases: 300
          - name: debug-asan-ubsan
            build_type: Debug
            sanitize: "ON"
            fuzz_cases: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build g++ libyaml-cpp-dev libgtest-dev

      - name: Configure
        run: >
          cmake -S fleet_core -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DFLEET_SANITIZE=${{ matrix.sanitize }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Simulate the shipped config
        run: ./build/run_sim --config benchmarks/configs/default.yaml --out build/default_run

      - name: Baseline sweep matches the reference
        run: >
          ./build/run_sweep --config benchmarks/configs/baseline.yaml --out build/baseline
          --check benchmarks/reference/baseline_sweep.csv

      - name: Allocation benchmark runs (hungarian never worse than nearest)
        run: ./build/bench_allocation --rounds 200 --out build/bench_allocation.csv

      - name: Coordinated planners run an hour without a violation
        run: >
          ./build/bench_planning --config benchmarks/configs/planning.yaml
          --planners pibt,windowed_coop_astar,prioritized,ecbs,cbs --fleet 10 --seeds 1
          --out build/bench_planning.csv

      - name: Late robots run an hour without a violation
        run: >
          ./build/bench_planning --config benchmarks/configs/planning.yaml
          --planners pibt,windowed_coop_astar,prioritized,ecbs,cbs --fleet 10 --seeds 1
          --delay 0.2 --out build/bench_late.csv

      - name: A closed aisle runs an hour without a violation
        run: >
          ./build/bench_planning --config benchmarks/configs/closure.yaml
          --planners pibt,windowed_coop_astar,prioritized,ecbs,cbs --fleet 10 --seeds 1
          --out build/bench_closure.csv

      - name: Deaths, outages, and lost messages run an hour without a violation
        run: >
          ./build/bench_planning --config benchmarks/configs/faults.yaml
          --planners pibt,windowed_coop_astar,prioritized,ecbs,cbs --fleet 10 --seeds 1
          --out build/bench_faults.csv

      - name: Fuzz harness finds no failure
        run: ./build/fuzz_sim --cases ${{ matrix.fuzz_cases }} --seed 1 --out build/fuzz_failures

      - name: README tables match the evidence
        if: matrix.name == 'release'
        run: python3 benchmarks/scripts/evidence.py tables --check

      - name: One run of every benchmark suite matches its evidence
        if: matrix.name == 'release'
        run: python3 benchmarks/scripts/evidence.py verify --sample 1

  format:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install clang-format 18.1.3
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet clang-format==18.1.3

      - name: Check formatting
        run: git ls-files '*.cpp' '*.hpp' | xargs .venv/bin/clang-format --dry-run --Werror
