# Faults (Stage 6): the planning scenario with two robots that die, one robot out of touch for a
# minute, one for three seconds, and one in ten reports and commands lost. bench_planning runs it
# like planning.yaml:
#
#   ./build/bench_planning --config benchmarks/configs/faults.yaml --fleet 10,25 --seeds 1-10
#
# Rules:
#   - Unknown or duplicate keys are errors, so a typo never silently falls back to a default.
#   - Missing keys take the built-in defaults, which default.yaml lists.
#   - map.file resolves relative to this file. run.output_dir is relative to the working directory.
#   - 1 step = 1 simulated second. Robots move one cell per step.
#   - The coordinator only learns of a fault from the reports that stop: a robot silent for more
#     than heartbeat_timeout_steps is declared dead, even if it is only out of touch. A dead
#     robot stays on its cell until rescue_steps after it died, when it is taken off the floor.
run:
  name: faults
  seed: 1                     # master seed; each random stream derives its own seed from it
  horizon_steps: 3600         # one simulated hour
  warmup_steps: 600           # excluded from steady-state metrics
  output_dir: benchmarks/results/faults

map:
  file: ../../maps/warehouse_small.txt
  # Or generate a layout instead of loading a file (set one, not both):
  # generator: {blocks_x: 5, blocks_y: 4, block_width: 6, block_height: 2, stations: 4, parking_rows: 1}

fleet:
  size: 10

orders:
  arrival_rate: 0.1           # Poisson mean orders per step
  service_steps: 2            # dwell at each pickup and dropoff station

allocation:
  method: hungarian           # nearest | hungarian | cost_aware | learned
  congestion_weight: 1.0      # cost_aware only
  # model_file: model.json    # learned only, and required there (docs/learning_track.md)

planning:
  # independent_astar ignores the other robots (the baseline). The others are coordinated: they
  # need features.station_queues and features.parking, and windowed_coop_astar and pibt also
  # need features.rolling_replanning.
  method: pibt                # independent_astar | prioritized | windowed_coop_astar | cbs | ecbs | pibt
  window: 20                  # rolling replanning: conflict-free steps per plan (prioritized: all)
  replan_period: 5            # rolling replanning: replan every k steps (k <= window)
  expansion_budget: 200000    # node expansions per planning call; deterministic time limit
  ecbs_suboptimality: 1.2     # ecbs only; cost bound w >= 1

execution:
  delay_probability: 0.0      # chance that a robot misses a step

faults:
  heartbeat_timeout_steps: 5  # silent this long: robot declared dead
  rescue_steps: 120           # dead robot removed from the floor after this long
  packet_loss: 0.1            # drop probability per report and per command
  events:
    - {at: 600, type: robot_death, robot: 0}
    - {at: 900, type: comm_outage, robot: 5, duration: 60}
    - {at: 1800, type: robot_death, robot: 3}
    - {at: 2400, type: comm_outage, robot: 7, duration: 3}

features:                     # one switch per feature, for ablations
  station_queues: true
  parking: true
  distance_oracle: true       # false: Manhattan distance
  congestion_cost: true       # cost_aware allocation penalizes congested routes
  rolling_replanning: true    # coordinated: all robots every replan_period steps; off: on goal change
  dependency_graph: true      # execution dependency graph (delay tolerance)
  intersection_reservations: true
  deadlock_recovery: true
  starvation_guard: true

verification:
  on_violation: abort         # abort | record

objective:                    # J = sum of weight x term, terms normalized by the baseline (Stage 7)
  w_completion: 1.0
  w_distance: 1.0
  w_congestion: 1.0
  w_replanning: 1.0
