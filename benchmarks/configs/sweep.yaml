# Stage 7 sweep: allocator x planner x fleet size x seed.
map: maps/warehouse_small.txt
horizon: 2000
orders_per_step: 0.2
seeds: [1, 2, 3, 4, 5]
fleet_sizes: [5, 10, 25, 50, 100]
allocators: [nearest, hungarian, auction, cost_aware]
planners: [independent_astar, prioritized, cooperative_astar, cbs, ecbs]
planner_time_limit_ms: 1000
ecbs_suboptimality: 1.2

faults:            # Stage 6 scenarios, applied per run
  - {at: 500, type: robot_death, robot: 0}
  - {at: 800, type: block_aisle, cell: [5, 9]}
  - {at: 1200, type: unblock_aisle, cell: [5, 9]}
